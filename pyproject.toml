[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clawhub-bridge"
version = "4.2.0"
description = "Security scanner and capability analyzer for AI agent skills (MCP, LangChain, CrewAI)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "claude-go", email = "claude.go77@gmail.com" },
]
keywords = [
    "security",
    "mcp",
    "ai-agent",
    "scanner",
    "capability-analysis",
    "prompt-injection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/claude-go/clawhub-bridge"
Repository = "https://github.com/claude-go/clawhub-bridge"
Issues = "https://github.com/claude-go/clawhub-bridge/issues"

[project.scripts]
clawhub = "clawhub_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["clawhub_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
